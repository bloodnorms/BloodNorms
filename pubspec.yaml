name: bloodnorms
description: "BloodNorms — Emergency blood-donor finder for India. Fast, Real, Safe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Cupertino Icons font (Apple design system - mandatory per 05-UI-UX-DESIGN-SYSTEM.md)
  cupertino_icons: ^1.0.8

  # Supabase client (Auth, Database, PostgREST, Realtime, Storage, RPC)
  supabase_flutter: ^2.8.0

  # Routing with deep-linking support (/b, /live/:id, /d/:id, /admin, /bank)
  go_router: ^14.6.2

  # State management
  flutter_riverpod: ^2.6.1

  # Maps (OpenStreetMap - Leaflet equivalent for Flutter, free, no Google billing)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utility
  url_launcher: ^6.3.1
  intl: ^0.20.1
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  geolocator: ^13.0.2
  http: ^1.2.2
  device_preview: ^1.3.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
