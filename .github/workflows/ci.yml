name: BloodNorms CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-quality-gate:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test --coverage

  voice-gateway-quality-gate:
    name: Voice Gateway Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: voice-gateway/package-lock.json

      - name: Install Dependencies
        working-directory: voice-gateway
        run: npm ci

      - name: Typecheck & Build
        working-directory: voice-gateway
        run: npm run build

      - name: Run Voice Gateway Unit & Integration Tests
        working-directory: voice-gateway
        run: npm test

  database-lint:
    name: SQL Migrations Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify All 17 Migrations Present
        run: |
          count=$(ls -1 supabase/migrations/0*.sql | wc -l)
          echo "Found $count SQL migration files."
          if [ "$count" -lt 17 ]; then
            echo "Error: Expected at least 17 migrations, found $count"
            exit 1
          fi
          echo "All 17 SQL migrations verified."
