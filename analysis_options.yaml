# ==============================================================================
# BloodNorms — Dart / Flutter Analysis Options
# ==============================================================================
# Inherits the recommended Flutter lint set, then adds project-specific rules.
# Run with: flutter analyze
# ==============================================================================

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # CLI diagnostic scripts use print() intentionally
    - scripts/**
    # Dart tool generated files
    - .dart_tool/**
    # Build output
    - build/**

linter:
  rules:
    # --- Code style ---
    prefer_single_quotes: true
    directives_ordering: true
    always_declare_return_types: true
    prefer_const_constructors: true
    prefer_const_declarations: true

    # --- Safety ---
    # avoid_print is enforced; scripts/ dir is excluded above so CLI tools are unaffected
    avoid_print: true

    # --- Dart best practices ---
    prefer_interpolation_to_compose_strings: true
    unnecessary_null_checks: true
    unnecessary_this: true

    # --- Future/progressive rules (enabled as we refactor files) ---
    # avoid_dynamic_calls: true        # ~30 hits in supabase_service — enable after service split
    # prefer_final_locals: true        # ~5 hits in supabase_service — enable after service split
