# ==============================================================================
# BloodNorms — Dart / Flutter Analysis Options
# ==============================================================================
# Inherits the recommended Flutter lint set, then adds project-specific rules.
# Run with: flutter analyze
# ==============================================================================

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # CLI diagnostic scripts use print() intentionally
    - scripts/**
    # Dart tool generated files
    - .dart_tool/**
    # Build output
    - build/**

linter:
  rules:
    # --- Code style ---
    prefer_single_quotes: true
    directives_ordering: true
    always_declare_return_types: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true

    # --- Safety ---
    avoid_print: true           # Use debugPrint() in app code; scripts/ is excluded above
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true

    # --- Dart best practices ---
    prefer_named_parameters_for_constructors: false  # Too noisy for existing code
    use_string_buffers: true
    prefer_interpolation_to_compose_strings: true
    unnecessary_null_checks: true
    unnecessary_this: true

    # --- Pub / imports ---
    depend_on_referenced_packages: true
